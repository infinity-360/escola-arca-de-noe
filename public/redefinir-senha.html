<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha · Escola Arca de Noé</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="center-page">
    <div class="card" style="width:min(460px,100%);text-align:left;padding:32px">
      <a class="brand" href="./" style="margin-bottom:22px"><img src="img/logo.jpg" alt="" width="58" height="58"><span><span class="brand-name">Arca de Noé</span><span class="brand-sub">Redefinir senha</span></span></a>
      <h2 style="font-size:1.8rem">Criar nova senha 🔐</h2>
      <p class="muted">Escolha uma senha com pelo menos 8 caracteres, contendo letras e números.</p>
      <form class="form" id="resetForm" novalidate>
        <div class="form-alert hidden" role="alert"></div>
        <div class="field"><label for="p1">Nova senha</label><div class="pw-wrap"><input class="input" id="p1" name="password" type="password" autocomplete="new-password" required><button class="pw-toggle" type="button" aria-label="Mostrar senha">👁️</button></div></div>
        <div class="field"><label for="p2">Confirmar nova senha</label><div class="pw-wrap"><input class="input" id="p2" name="password2" type="password" autocomplete="new-password" required><button class="pw-toggle" type="button" aria-label="Mostrar senha">👁️</button></div></div>
        <button class="btn btn-green" type="submit">Salvar nova senha</button>
      </form>
      <div id="done" class="hidden">
        <div class="alert alert-ok">Senha alterada com sucesso! ✅</div>
        <a class="btn mt" id="goLogin" href="pais.html">Ir para o login</a>
      </div>
    </div>
  </div>
<script type="module">
  import { $, api, formData, submitting, setupPasswordToggles } from './js/common.js';
  setupPasswordToggles();
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  // Remove o token da barra de endereço (não fica no histórico)
  history.replaceState(null, '', location.pathname);
  const form = $('#resetForm');
  if (!token) { form.querySelector('.form-alert').className = 'form-alert alert alert-error'; form.querySelector('.form-alert').textContent = 'Link inválido. Solicite uma nova recuperação de senha.'; form.querySelector('[type=submit]').disabled = true; }
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    submitting(form, async () => {
      const d = formData(form);
      if (d.password !== d.password2) throw new Error('As senhas não conferem.');
      const r = await api('/api/auth/reset', { method: 'POST', body: { token, password: d.password } });
      form.classList.add('hidden');
      $('#done').classList.remove('hidden');
      $('#goLogin').href = r.area === 'equipe' ? 'equipe.html' : 'pais.html';
    });
  });
</script>
</body>
</html>
